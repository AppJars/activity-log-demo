appjars.activitylog.demo.home.tour.activitylog=Activity log
appjars.activitylog.demo.home.tour.extractors=Extractors
appjars.activitylog.demo.home.tour.removers=Removers
appjars.activitylog.demo.home.tour.logviews=Log views
appjars.activitylog.demo.home.tour.savedlogview=A saved view
appjars.activitylog.demo.home.tour.extractoreditor=Extractor editor
appjars.activitylog.demo.home.tour.removereditor=Remover editor
appjars.activitylog.demo.home.tour.logvieweditor=Log view editor
appjars.activitylog.demo.home.license.title=Free vs. full license
appjars.activitylog.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 100 logs per day. Once that limit is reached the log turns read-only and live updates are disabled. A full license removes the limit: nothing else changes.
appjars.activitylog.demo.home.license.link=Get a license at appjars.com
appjars.activitylog.demo.home.links.title=Learn more
appjars.activitylog.demo.home.links.github=AppJars on GitHub
appjars.activitylog.demo.home.links.readme=Activity Log documentation

# Guided tours
appjars.activitylog.demo.tour.btn.next=Next
appjars.activitylog.demo.tour.btn.back=Back
appjars.activitylog.demo.tour.btn.done=Done
appjars.activitylog.demo.tour.activitylog.intro.title=The activity log
appjars.activitylog.demo.tour.activitylog.intro.desc=This is the full log view: every event your application recorded, newest filters on top and the entries below. Let''s go through it.
appjars.activitylog.demo.tour.activitylog.filters.title=Filters
appjars.activitylog.demo.tour.activitylog.filters.desc=Filter by logger, detail text, level, session id and a start/end date-time range. On a narrow screen these fields move into a dialog behind the Filter button.
appjars.activitylog.demo.tour.activitylog.filter.title=Apply or clear
appjars.activitylog.demo.tour.activitylog.filter.desc=Filter applies what you typed; Clear resets everything back to the full log.
appjars.activitylog.demo.tour.activitylog.grid.title=The entries
appjars.activitylog.demo.tour.activitylog.grid.desc=Logger, detail, level and timestamp, sortable and resizable. Use Inspect, or double-click a row, to see the full detail, the originating session and the stack trace.
appjars.activitylog.demo.tour.activitylog.live.title=Live updates
appjars.activitylog.demo.tour.activitylog.live.desc=Turn this on and the grid refreshes itself as new entries are persisted. It needs Vaadin Push enabled in the host application, and a full license.
appjars.activitylog.demo.tour.activitylog.trigger.title=Generate a log
appjars.activitylog.demo.tour.activitylog.trigger.desc=This menu belongs to the demo, not to the appjar: each level records one more event of the simulated application, and Custom log... lets you write the logger, detail and level yourself. Watch the extractor pick the entry up and Live show it right away.
appjars.activitylog.demo.tour.activitylog.license.title=Free license
appjars.activitylog.demo.tour.activitylog.license.desc=This bar tracks how many logs today''s free-license quota has left. With a full license it is not shown at all.
appjars.activitylog.demo.tour.extractors.intro.title=Extractors
appjars.activitylog.demo.tour.extractors.intro.desc=An extractor decides which events of your logging framework are persisted as activity logs. The demo ships with one, active, capturing the simulated application''s loggers. This tour shows you around it.
appjars.activitylog.demo.tour.extractors.grid.title=Your extractors
appjars.activitylog.demo.tour.extractors.grid.desc=This is where your extractors are listed: one row per rule, with its levels and whether it is currently active. Expand the preloaded rule to see the filters it applies: the loggers of the simulated application, any detail, at any time.
appjars.activitylog.demo.tour.extractors.filters.title=Find a rule
appjars.activitylog.demo.tour.extractors.filters.desc=Filter the list by name, by availability (active or inactive) and by log level.
appjars.activitylog.demo.tour.extractors.new.title=New extractor
appjars.activitylog.demo.tour.extractors.new.desc=Opens the editor: name the rule, pick the levels to capture, add logger and detail patterns, restrict it to given days and times, and choose whether the stack trace and the session id are stored.
appjars.activitylog.demo.tour.extractors.actions.title=Row actions
appjars.activitylog.demo.tour.extractors.actions.desc=Every row offers Edit, Copy (to derive a new rule from an existing one), Activate/Deactivate and Delete.
appjars.activitylog.demo.tour.extractors.license.title=Free license
appjars.activitylog.demo.tour.extractors.license.desc=Rules stay editable while the free-license quota of 100 logs per day is not exceeded. With a full license this bar is not shown.
appjars.activitylog.demo.tour.removers.intro.title=Removers
appjars.activitylog.demo.tour.removers.intro.desc=A remover is a retention rule: it tells the scheduled pruner which logs may be dropped. The demo ships with one that drops activity older than an hour, left inactive so the preloaded entries survive.
appjars.activitylog.demo.tour.removers.grid.title=Your removers
appjars.activitylog.demo.tour.removers.grid.desc=This is where your retention rules are listed: one row per rule, with its levels and whether it is active. Expand the preloaded rule to see its filters, and its one-hour expiration.
appjars.activitylog.demo.tour.removers.filters.title=Find a rule
appjars.activitylog.demo.tour.removers.filters.desc=Filter the list by name, by availability (active or inactive) and by log level.
appjars.activitylog.demo.tour.removers.new.title=New remover
appjars.activitylog.demo.tour.removers.new.desc=Opens the editor: name the rule, pick the levels it removes, add logger patterns and restrict it to the days and times where pruning is allowed.
appjars.activitylog.demo.tour.removers.actions.title=Row actions
appjars.activitylog.demo.tour.removers.actions.desc=Every row offers Edit, Copy, Activate/Deactivate and Delete. Deactivating a rule stops the pruner from applying it, without losing it.
appjars.activitylog.demo.tour.removers.license.title=Free license
appjars.activitylog.demo.tour.removers.license.desc=Rules stay editable while the free-license quota of 100 logs per day is not exceeded. With a full license this bar is not shown.
appjars.activitylog.demo.tour.logviews.intro.title=Custom log views
appjars.activitylog.demo.tour.logviews.intro.desc=A custom log view is a saved, preconfigured version of the log view, published on its own route. The demo ships with one, Application errors, on the al/errors route: it only ever shows ERROR entries, and its users cannot widen that.
appjars.activitylog.demo.tour.logviews.grid.title=Your views
appjars.activitylog.demo.tour.logviews.grid.desc=This is where your saved views are listed: title, the levels each one shows, the route it is published on and the detail filter it applies.
appjars.activitylog.demo.tour.logviews.filters.title=Find a view
appjars.activitylog.demo.tour.logviews.filters.desc=Filter the list by title, levels, detail text or route.
appjars.activitylog.demo.tour.logviews.new.title=New log view
appjars.activitylog.demo.tour.logviews.new.desc=Opens the editor: give the view a title and a route, fix the filters it always applies, and choose which columns, which filters and whether live updates are offered to its users.
appjars.activitylog.demo.tour.logviews.actions.title=Row actions
appjars.activitylog.demo.tour.logviews.actions.desc=Every row offers View (opens the saved view on its own route), Edit and Delete.
appjars.activitylog.demo.tour.logviews.license.title=Free license
appjars.activitylog.demo.tour.logviews.license.desc=Views stay editable while the free-license quota of 100 logs per day is not exceeded. With a full license this bar is not shown.

appjars.activitylog.demo.tour.savedlogview.intro.title=A saved view in use
appjars.activitylog.demo.tour.savedlogview.intro.desc=This is what the editor produces: the preloaded Application errors view, published on its own al/errors route. Its level is fixed to ERROR, so everyone who opens it sees the errors and nothing else.
appjars.activitylog.demo.tour.savedlogview.filters.title=What its users can filter
appjars.activitylog.demo.tour.savedlogview.filters.desc=Only the filters the view enables. There is no level filter here: the view fixes the level, so its users can narrow within the errors but never widen past them.
appjars.activitylog.demo.tour.savedlogview.grid.title=The entries
appjars.activitylog.demo.tour.savedlogview.grid.desc=Errors only, in the columns the view was configured with. Inspect still opens the full detail, the session and the stack trace.
appjars.activitylog.demo.tour.savedlogview.live.title=Live updates
appjars.activitylog.demo.tour.savedlogview.live.desc=A saved view can offer live updates like the full log does. Turn it on and use Trigger log with the ERROR level to watch an entry arrive.
appjars.activitylog.demo.tour.savedlogview.license.title=Free license
appjars.activitylog.demo.tour.savedlogview.license.desc=Saved views work in free mode within the daily limit of 100 logs. Past it the log turns read-only and live updates stop.
appjars.activitylog.demo.tour.extractoreditor.intro.title=The extractor editor
appjars.activitylog.demo.tour.extractoreditor.intro.desc=This is where an extraction rule is defined. You are looking at the preloaded Application activity rule, the one capturing the simulated application, so every section is filled in. Nothing you see here is saved unless you press Save.
appjars.activitylog.demo.tour.extractoreditor.name.title=Name
appjars.activitylog.demo.tour.extractoreditor.name.desc=How the rule is identified in the list. It has to be unique.
appjars.activitylog.demo.tour.extractoreditor.timefilters.title=Time filters
appjars.activitylog.demo.tour.extractoreditor.timefilters.desc=When the rule captures. Enabled all the time is what the preloaded rule uses; uncheck it and a grid appears where you add windows: a date range, a range of days between two dates, or given days of the week, each optionally narrowed to a time range.
appjars.activitylog.demo.tour.extractoreditor.levels.title=Log levels
appjars.activitylog.demo.tour.extractoreditor.levels.desc=Which severities the rule captures. At least one is required; the preloaded rule takes them all.
appjars.activitylog.demo.tour.extractoreditor.stacktrace.title=Stacktraces
appjars.activitylog.demo.tour.extractoreditor.stacktrace.desc=Whether the stack trace is stored along with the entry, for the logs that carry a throwable. It is what the log view''s Show stacktrace section displays.
appjars.activitylog.demo.tour.extractoreditor.session.title=HTTP session
appjars.activitylog.demo.tour.extractoreditor.session.desc=Whether the id of the HTTP session that produced the log is stored with it. Stored, it becomes searchable: the log view filters by session id.
appjars.activitylog.demo.tour.extractoreditor.loggerfilters.title=Logger filters
appjars.activitylog.demo.tour.extractoreditor.loggerfilters.desc=Patterns matched against the logger name: this is what keeps framework noise out. Each one has a type: starts with, contains, exact, a raw regular expression. The preloaded rule keeps only the loggers of the simulated application. Click a row to edit it, or Add new logger filter for another one.
appjars.activitylog.demo.tour.extractoreditor.detailfilters.title=Detail filters
appjars.activitylog.demo.tour.extractoreditor.detailfilters.desc=The same, matched against the message text instead of the logger name. The preloaded rule takes any detail. An entry is captured when it matches a logger filter and a detail filter, at a moment the time filters allow, with one of the levels above.
appjars.activitylog.demo.tour.extractoreditor.calendar.title=What the rule covers
appjars.activitylog.demo.tour.extractoreditor.calendar.desc=The year at a glance: the days the time filters cover are highlighted. Click one and Time periods shows the exact ranges that apply to it. On narrow screens this panel is not shown.
appjars.activitylog.demo.tour.extractoreditor.actions.title=Save, cancel or delete
appjars.activitylog.demo.tour.extractoreditor.actions.desc=Save validates the whole form (a name, at least one level, and at least one filter in each grid) and returns to the list. Cancel discards. Delete removes the rule, and only shows up when you are editing an existing one.
appjars.activitylog.demo.tour.removereditor.intro.title=The remover editor
appjars.activitylog.demo.tour.removereditor.intro.desc=This is where a retention rule is defined. You are looking at the preloaded rule that drops activity older than an hour, left inactive so the demo data survives. Its criteria work exactly like an extractor''s, only here matching means being deleted.
appjars.activitylog.demo.tour.removereditor.name.title=Name
appjars.activitylog.demo.tour.removereditor.name.desc=How the rule is identified in the list. It has to be unique.
appjars.activitylog.demo.tour.removereditor.expiration.title=Logs age expiration
appjars.activitylog.demo.tour.removereditor.expiration.desc=How old an entry has to be before this rule may drop it: an amount and a unit, from seconds to years. The preloaded rule uses one hour.
appjars.activitylog.demo.tour.removereditor.timefilters.title=Time filters
appjars.activitylog.demo.tour.removereditor.timefilters.desc=Which entries are eligible by their timestamp. Enabled all the time is what the preloaded rule uses; uncheck it and a grid appears where you add windows: dates, days of the week, time ranges.
appjars.activitylog.demo.tour.removereditor.levels.title=Log levels
appjars.activitylog.demo.tour.removereditor.levels.desc=Which severities the rule removes. At least one is required; the preloaded rule takes them all.
appjars.activitylog.demo.tour.removereditor.loggerfilters.title=Logger filters
appjars.activitylog.demo.tour.removereditor.loggerfilters.desc=Patterns matched against the logger name, so a rule prunes one part of the application without touching the others. Click a row to edit it, or Add new logger filter for another one.
appjars.activitylog.demo.tour.removereditor.detailfilters.title=Detail filters
appjars.activitylog.demo.tour.removereditor.detailfilters.desc=The same, matched against the message text. An entry is dropped when it is older than the expiration and matches every criterion of the rule, so the narrower these filters are, the less the pruner touches.
appjars.activitylog.demo.tour.removereditor.calendar.title=What the rule covers
appjars.activitylog.demo.tour.removereditor.calendar.desc=The year at a glance: the days the time filters cover are highlighted. Click one and Time periods shows the exact ranges that apply to it. On narrow screens this panel is not shown.
appjars.activitylog.demo.tour.removereditor.actions.title=Save, cancel or delete
appjars.activitylog.demo.tour.removereditor.actions.desc=Save validates the form and returns to the list. A saved rule does nothing until it is activated from the list, which is why the preloaded one is still there. Cancel discards; Delete only shows up when you are editing an existing rule.
appjars.activitylog.demo.tour.logvieweditor.intro.title=The log view editor
appjars.activitylog.demo.tour.logvieweditor.intro.desc=This is where a saved log view is configured. You are looking at the preloaded Application errors view. What you set here is fixed for whoever opens the view: they filter within it, they cannot widen it.
appjars.activitylog.demo.tour.logvieweditor.title.title=Title
appjars.activitylog.demo.tour.logvieweditor.title.desc=The name of the view, shown in the list and as the page title when it is opened.
appjars.activitylog.demo.tour.logvieweditor.logger.title=Logger
appjars.activitylog.demo.tour.logvieweditor.logger.desc=Restricts the view to the entries whose logger matches this text. Left empty, every logger is shown.
appjars.activitylog.demo.tour.logvieweditor.levels.title=Levels
appjars.activitylog.demo.tour.logvieweditor.levels.desc=The severities the view shows. At least one is required. The preloaded view fixes it to ERROR, which is what makes it an errors view.
appjars.activitylog.demo.tour.logvieweditor.detail.title=Log detail
appjars.activitylog.demo.tour.logvieweditor.detail.desc=Restricts the view to the entries whose message matches this text. Left empty, every detail is shown.
appjars.activitylog.demo.tour.logvieweditor.dates.title=Log start and end
appjars.activitylog.demo.tour.logvieweditor.dates.desc=A fixed period for the view. Start has to come before end, and either can be left empty for an open bound. Useful for a view of one incident; left empty, the view follows the log as it grows.
appjars.activitylog.demo.tour.logvieweditor.route.title=Route
appjars.activitylog.demo.tour.logvieweditor.route.desc=The path the view is published on, al/errors for the preloaded one. It has to be free: routes already taken by the application are rejected. Saving registers it right away, no restart.
appjars.activitylog.demo.tour.logvieweditor.columns.title=Grid columns visibility
appjars.activitylog.demo.tour.logvieweditor.columns.desc=Which of the four columns (logger, detail, level, timestamp) the view shows. Hiding the level column makes sense on a view already fixed to one level.
appjars.activitylog.demo.tour.logvieweditor.filters.title=Filters availability
appjars.activitylog.demo.tour.logvieweditor.filters.desc=Which filters its users get. The preloaded view offers logger, detail, timestamp and session, but not level: a filter left out here is a criterion its users cannot touch.
appjars.activitylog.demo.tour.logvieweditor.live.title=Live logs
appjars.activitylog.demo.tour.logvieweditor.live.desc=Whether the view refreshes itself as new entries are persisted.
appjars.activitylog.demo.tour.logvieweditor.actions.title=Save, cancel or delete
appjars.activitylog.demo.tour.logvieweditor.actions.desc=Save validates the form, registers the route and returns to the list. Cancel discards. Delete removes the view and frees its route, and only shows up when you are editing an existing one.

# Landing page
appjars.activitylog.demo.home.title=Activity Log Demo
appjars.activitylog.demo.home.hero.title=Activity Log
appjars.activitylog.demo.home.hero.tagline=Turn the events that matter in your application into a searchable, filterable audit trail, without writing a logging layer of your own.
appjars.activitylog.demo.home.features.title=What''s inside
appjars.activitylog.demo.home.features.auditlog.title=Central activity log
appjars.activitylog.demo.home.features.auditlog.desc=Every functional event your application records lands in one datastore, with its logger, detail, level, timestamp, session and stack trace.
appjars.activitylog.demo.home.features.filters.title=Search and filtering
appjars.activitylog.demo.home.features.filters.desc=Narrow the log down by logger, detail, level, session id and date-time range, and inspect any entry in full.
appjars.activitylog.demo.home.features.live.title=Live updates
appjars.activitylog.demo.home.features.live.desc=Turn Live on and new entries appear in the grid as they are persisted, pushed from the server.
appjars.activitylog.demo.home.features.extractors.title=Extractors
appjars.activitylog.demo.home.features.extractors.desc=Decide which events of your logging framework become activity logs: by level, by logger or detail pattern, within the time windows you choose.
appjars.activitylog.demo.home.features.removers.title=Removers
appjars.activitylog.demo.home.features.removers.desc=Define retention rules and let the scheduled pruner drop the logs you no longer need, in the background.
appjars.activitylog.demo.home.features.logviews.title=Custom log views
appjars.activitylog.demo.home.features.logviews.desc=Save preconfigured views of the log (fixed filters, visible columns, its own route) and hand each team the one it needs.
appjars.activitylog.demo.home.features.configurable.title=Configurable
appjars.activitylog.demo.home.features.configurable.desc=View routes, pruning frequency and batch size, and the extraction queue capacity are all application properties.
appjars.activitylog.demo.home.tryit.title=Try it now
appjars.activitylog.demo.home.tryit.intro=This demo needs no login: open any of the views below, or take a guided tour that walks you through it.
appjars.activitylog.demo.home.tryit.preloaded=The demo arrives preloaded as a real installation would be: a week of activity from a fictional order-management application, an active extractor, Application activity, capturing every level of its loggers along with stack traces and session ids, a saved Application errors view published on its own al/errors route, and a retention rule that drops activity older than one hour. That rule ships inactive on purpose: activating it prunes the preloaded entries within seconds, since all of them are older than an hour. Delete the ./data directory to get the whole set back.
appjars.activitylog.demo.home.tryit.trigger=The drawer''s Trigger log menu continues the story: pick a level to record one more event of the order narrative, or Custom log... to write the logger, detail and level yourself. Entries are emitted through the application''s logging framework, so you can watch the extractor capture them live, and watch nothing being stored when the logger falls outside its filters.
appjars.activitylog.demo.home.tryit.activitylog=Open the log
appjars.activitylog.demo.home.tryit.extractors=Extractors
appjars.activitylog.demo.home.tryit.removers=Removers
appjars.activitylog.demo.home.tryit.logviews=Log views

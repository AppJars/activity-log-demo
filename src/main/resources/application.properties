###

# ============================================================
# Datastore
# ============================================================

# The demo keeps its data in a file-based H2 database under ./data.
# Delete that directory to get the preloaded set back.
spring.datasource.url=jdbc:h2:./data/activitylogdemo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# Set to true to print the SQL the module runs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Vaadin
# ============================================================

# Resolves the AppJars message bundles, this demo's own included
vaadin.i18n.provider=com.appjars.utils.i18n.AppjarsI18nProvider

# ============================================================
# Activity Log: view routes
# ============================================================
# Every value below is the module default, written out so the whole set of
# routes is visible in one place. Give a property another route to move a view.

# The full activity log
com.appjars.activitylog.url.activitylog=al/activitylog

# Extractors: the list, and the form in its two modes
com.appjars.activitylog.url.extractors=al/extractors
com.appjars.activitylog.url.extractors-create=al/extractors/create
com.appjars.activitylog.url.extractors-edit=al/extractors/edit

# Removers: the list, and the form in its two modes
com.appjars.activitylog.url.removers=al/removers
com.appjars.activitylog.url.removers-create=al/removers/create
com.appjars.activitylog.url.removers-edit=al/removers/edit

# Saved log views: the list, and the form in its two modes. Each saved view is
# published on the route configured in the view itself, not here.
com.appjars.activitylog.url.logviewer=al/logviewer
com.appjars.activitylog.url.logviewer-create=al/logviewer/create
com.appjars.activitylog.url.logviewer-edit=al/logviewer/edit

# ============================================================
# Activity Log: retention
# ============================================================

# Whether the scheduled pruner may delete the logs the active removers cover.
# With it false, removers can be configured but nothing is ever deleted.
com.appjars.activitylog.logspruner.removalEnabled=true

# Seconds between pruning rounds
com.appjars.activitylog.logspruner.pruningFrequency=5

# Most logs a single round may delete
com.appjars.activitylog.logspruner.maxLogsPerRound=500

# ============================================================
# Activity Log: capture
# ============================================================

# Capacity of the queue between the appender and the thread that persists.
# A log arriving at a full queue is discarded rather than blocking the caller,
# so raise this if bursts of activity are being lost.
com.appjars.activitylog.appendersconnector.queueCapacity=1000

# Register the appender automatically when log4j2.xml does not declare it.
# This demo declares it in log4j2.xml, so nothing is registered automatically.
com.appjars.activitylog.appender.autoRegister=true

# Fail startup when the logging setup cannot be captured. With it false the
# application starts anyway and the failure is reported as a warning.
com.appjars.activitylog.appender.strict=true

# ============================================================
# Activity Log: date and time formats
# ============================================================
# Patterns the views use to render each kind of value

com.appjars.activitylog.dateformat=dd-MM-yy
com.appjars.activitylog.timeformat=HH:mm
com.appjars.activitylog.datetimeformat=dd-MM-yyyy HH:mm:ss
